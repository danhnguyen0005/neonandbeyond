<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản trị · Hàn Ngữ Sơ Cấp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  .side{background:var(--ink);color:#cfd7df;border-right:none}
  .side .brand{color:#fff}
  .side .nav a{color:#aab6c2} .side .nav a:hover{background:rgba(255,255,255,.06);color:#fff} .side .nav a.on{background:rgba(255,255,255,.1);color:#fff}
  .side .foot{border-color:rgba(255,255,255,.12)} .side .foot .faint{color:#8795a3}
  .side .btn{background:transparent;color:#cfd7df;border-color:rgba(255,255,255,.18)}
  :root[data-theme="dark"] .side, .side{--x:1}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .filters .field{min-width:130px}
  .opt-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
  .pager{display:flex;gap:6px;align-items:center;justify-content:flex-end}
  .prompt-cell{max-width:420px}
  .pill-ok{color:var(--ok);font-weight:600} .pill-no{color:var(--warn);font-weight:600}
  .mrow{display:grid;grid-template-columns:minmax(0,2fr) 120px 90px auto;gap:8px;align-items:center}
  @media (max-width:860px){.side{display:flex;position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}.side .nav{display:flex;flex-wrap:wrap}.side .foot{display:none}.shell{grid-template-columns:1fr}.side .brand{padding:4px 8px}}
</style>
</head>
<body>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
